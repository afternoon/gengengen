[package]
name = "gengengen"
version = "0.1.0"
edition = "2021"
description = "Generative sequencer program card for the Music Thing Workshop System Computer"
license = "MIT"

# Embedded-only dependencies. Gating these on the ARM target keeps `cargo test`
# on the dev machine working: the Cortex-M crates cannot build for macOS (ARM
# inline asm, Mach-O vector table sections), and the pure logic under test does
# not need them.
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-rp = { version = "0.4", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-executor = { version = "0.7", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "task-arena-size-98304",
] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-embedded-hal = "0.3"
embassy-futures = "0.1"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
portable-atomic = { version = "1.10", features = ["critical-section"] }
static_cell = "2.1"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
lto = true
opt-level = 'z'
debug = 2

[profile.dev]
opt-level = 1
